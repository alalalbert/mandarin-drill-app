<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1c1e">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>Mandarin</title>
<style>
  :root{--bg:#1c1c1e;--row:#26262a;--row2:#2c2c30;--fg:#f2f2f7;--muted:#8e8e93;
        --dim:#636368;--line:#3a3a3c;--green:#30d158;--red:#ff453a;
        --blue:#0a84ff;--amber:#ff9f0a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);
       font:16px -apple-system,system-ui,sans-serif;
       padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
       display:flex;flex-direction:column;overflow:hidden}
  .screen{display:none;flex:1;flex-direction:column;min-height:0}
  .screen.on{display:flex}
  .kicker{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted);
          text-align:center;margin-top:28px}
  h1{font-size:32px;font-weight:600;text-align:center;margin-top:10px}
  .sub{color:var(--muted);text-align:center;margin-top:6px;font-size:14px}
  .bar{height:8px;border-radius:4px;background:var(--row2);margin:20px 0 6px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:4px;background:var(--green)}
  .barcap{font-size:12px;color:var(--dim);text-align:center;margin-bottom:12px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 16px}
  .tile{background:var(--row);border:1px solid var(--line);border-radius:12px;
        padding:13px 6px;text-align:center}
  .tile b{display:block;font-size:23px;font-weight:600}
  .tile span{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
  button{appearance:none;border:1px solid var(--line);background:var(--row);
         color:var(--fg);border-radius:12px;font:inherit;width:100%;
         padding:14px 12px;margin-bottom:9px}
  button:active{background:var(--row2)}
  button.primary{border-color:var(--green);color:var(--green);font-weight:600;font-size:17px}
  button.crank{border-color:var(--blue);color:var(--blue);font-weight:600}
  button small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:3px}
  .pair{display:flex;gap:10px}.pair button{flex:1}
  #prompt{flex:0 1 auto;display:flex;align-items:center;justify-content:center;
          min-height:105px;text-align:center;font-size:29px;font-weight:500;padding:10px 4px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:14px;background:var(--row);
       border:1px solid var(--line);border-radius:12px;padding:15px 14px;
       font-size:16px;text-align:left}
  .opt b{color:var(--muted);font-size:13px;font-weight:600;min-width:14px}
  .opt.right{border-color:var(--green)}.opt.right,.opt.right b{color:var(--green)}
  .opt.wrong{border-color:var(--red)}.opt.wrong,.opt.wrong b{color:var(--red)}
  #foot{margin:auto 0 12px;padding-top:12px;color:var(--muted);font-size:13px;
        text-align:center;min-height:38px}
  /* The reveal is the thing being studied, not chrome -- it gets real type,
     and wraps: hanzi + pinyin + meaning + hint can run long. */
  #foot.reveal{color:var(--fg);font-size:19px;font-weight:500;line-height:1.35}
  /* The breakdown and the example sit under the reveal, a step quieter than
     it but still readable -- they are studied, not skimmed. */
  #foot .study{font-size:15px;font-weight:400;color:var(--muted);
               line-height:1.4;margin-top:6px}
  #done h1{margin:auto 0 8px}
  #done .sub{margin-bottom:auto;padding-bottom:20px}
  .status{font-size:12px;color:var(--dim);text-align:center;min-height:16px;margin-bottom:6px}
  .status.err{color:var(--red)}
  textarea{width:100%;background:var(--row);color:var(--fg);border:1px solid var(--line);
           border-radius:12px;padding:12px;font:14px ui-monospace,monospace;min-height:84px;
           margin:14px 0}
  #setup p{color:var(--muted);font-size:14px;line-height:1.5;margin-top:12px}
  /* --- recall practice --- */
  /* The character is the whole question here, so it gets far more room than
     a multiple-choice prompt: nothing else is on screen to compete. */
  #r-body{flex:1 1 auto;display:flex;flex-direction:column;
          align-items:center;justify-content:center;min-height:0;gap:18px}
  #r-face{font-size:76px;font-weight:500;line-height:1.1;text-align:center}
  #r-study{color:var(--fg);font-size:18px;line-height:1.4;text-align:center;
           padding:0 2px}
  #r-study .py{font-size:22px;font-weight:600;color:var(--green);margin-bottom:2px}
  #r-study .mn{font-size:19px;font-weight:500;margin-bottom:8px}
  #r-study .st{font-size:14px;font-weight:400;color:var(--muted);line-height:1.45;
               margin-top:5px}
  .rate{margin-top:14px}
  .rate .q{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);
           margin-bottom:6px;text-align:center}
  .rate .row{display:flex;gap:8px}
  .rate .row button{margin-bottom:0;padding:12px 6px;font-size:15px}
  .rate button.sel{border-color:var(--blue);color:var(--blue);font-weight:600}
  .rate.done .q{color:var(--dim)}
  #setup a{color:var(--blue)}
</style>
</head>
<body>

<div id="setup" class="screen">
  <div class="kicker">MANDARIN</div>
  <h1>Connect</h1>
  <p>This app stores your progress in your own private GitHub repo
     (<b id="s-repo"></b>). Paste a fine-grained personal access token that can
     read and write the contents of that one repo — nothing else.</p>
  <textarea id="tok" placeholder="github_pat_…" autocapitalize="off" autocorrect="off"></textarea>
  <button class="primary" onclick="saveToken()">Save and load deck</button>
  <div class="status err" id="s-err"></div>
</div>

<div id="home" class="screen">
  <div class="kicker">MANDARIN</div>
  <h1 id="h-due">…</h1>
  <div class="sub" id="h-sub"></div>
  <div class="bar"><i id="h-bar" style="width:0%"></i></div>
  <div class="barcap" id="h-cap"></div>
  <div class="tiles">
    <div class="tile"><b id="t-due" style="color:var(--amber)">–</b><span>DUE NOW</span></div>
    <div class="tile"><b id="t-today" style="color:var(--blue)">–</b><span>DONE TODAY</span></div>
    <div class="tile"><b id="t-acc" style="color:var(--green)">–</b><span>TODAY RIGHT</span></div>
    <div class="tile"><b id="t-streak">–</b><span>DAY STREAK</span></div>
  </div>
  <button class="primary" onclick="start('due')">Start session<small id="b-sub"></small></button>
  <button class="crank" onclick="startCrank()">30-minute session<small>rounds keep coming until time is up</small></button>
  <div class="pair">
    <button onclick="start('new')">New cards<small>newest batch first</small></button>
    <button onclick="start('hardest')">Trouble</button>
  </div>
  <div class="pair">
    <button onclick="start('lesson')">Latest batch</button>
    <button onclick="start('all')">Practice</button>
  </div>
  <div class="pair">
    <button onclick="start('phrases')">Phrases</button>
    <button onclick="start('simple')">Simple</button>
  </div>
  <div class="pair" id="h-learn">
    <button class="crank" onclick="startRecall()">Recall practice<small id="b-recall-sub">rate yourself</small></button>
    <button onclick="exportProgress()">Export<small>save a copy</small></button>
  </div>
  <button id="b-learn-off" onclick="toggleLearn()"></button>
  <button id="b-token" onclick="replaceToken()">Replace token</button>
  <button id="b-notif" onclick="enablePush()" style="display:none">Enable notifications</button>
  <div class="status" id="h-status"></div>
</div>

<div id="drill" class="screen">
  <div class="kicker" id="d-kicker"></div>
  <div id="prompt"></div>
  <div class="opts" id="opts"></div>
  <div id="foot"></div>
  <button class="primary" id="d-next" style="display:none" onclick="advance()">Next</button>
</div>

<div id="recall" class="screen">
  <div class="kicker" id="r-kicker">RECALL IT, THEN REVEAL</div>
  <div id="r-body">
    <div id="r-face"></div>
    <div id="r-study"></div>
  </div>
  <div id="r-rate"></div>
  <button class="primary" id="r-reveal" onclick="revealRecall()">Reveal</button>
  <button id="r-blank" onclick="revealBlank()">No idea</button>
  <button class="primary" id="r-next" style="display:none" onclick="nextRecall()">Next</button>
  <div class="status" id="r-status"></div>
</div>

<div id="done" class="screen">
  <h1 id="done-line"></h1>
  <div class="sub" id="done-sub"></div>
  <button class="primary" onclick="start('due')">Again</button>
  <button onclick="goHome()">Home</button>
</div>

<script src="./srs.js"></script>
<script src="./learn.js"></script>
<script>
'use strict';
/* Progress lives in a private GitHub repo that this page and the Mac both
   update. Every write names the version it replaces (the file SHA), so a
   conflicting write fails cleanly, gets merged per-card, and retries --
   the two devices cannot overwrite each other's answers. */

let CFG = null;
let TOKEN = localStorage.getItem('ghtok') || '';
let cards = [], state = {}, stateSha = null;
let pendingReviews = JSON.parse(localStorage.getItem('pendingReviews') || '[]');
let reviewDays = {};                    // day -> [done, right] from repo history
let queue = [], idx = 0, right = 0, wrong = 0, locked = false, crankEnd = 0;
let awaitingNext = false;
let pushBusy = false, pushDirty = false;

const $ = id => document.getElementById(id);
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  $(id).classList.add('on');
}
function status(msg, err) {
  const el = $('h-status');
  el.textContent = msg || '';
  el.className = 'status' + (err ? ' err' : '');
}

/* ------------------------- GitHub contents API -------------------------- */
function gh(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({
    'Authorization': 'Bearer ' + TOKEN,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
  }, opts.headers || {});
  return fetch('https://api.github.com' + path, opts);
}
const fileUrl = name =>
    `/repos/${CFG.owner}/${CFG.repo}/contents/${name}`;
const dec = b64 => new TextDecoder().decode(
    Uint8Array.from(atob(b64.replace(/\n/g, '')), c => c.charCodeAt(0)));
function enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 8192) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  }
  return btoa(bin);
}
async function getFile(name) {
  const r = await gh(fileUrl(name));
  if (r.status === 404) return { text: null, sha: null };
  if (!r.ok) throw new Error(name + ': HTTP ' + r.status);
  const j = await r.json();
  // Above 1 MB the contents API answers 200 with encoding "none" and an
  // EMPTY body -- no error to catch. cards.json crossed that line, the deck
  // came back blank, and the app reported itself offline. The sha is still
  // there, and the blob API serves the same object up to 100 MB.
  if (j.encoding === 'none' || (!j.content && j.size)) {
    const b = await gh('/repos/' + CFG.owner + '/' + CFG.repo +
                       '/git/blobs/' + j.sha);
    if (!b.ok) throw new Error(name + ' is ' + j.size +
                               ' bytes and the blob fetch failed: HTTP ' + b.status);
    const bj = await b.json();
    return { text: dec(bj.content), sha: j.sha };
  }
  return { text: dec(j.content), sha: j.sha };
}

// A fine-grained token with the wrong scope gets 404, not 403 -- GitHub hides
// private repos rather than admit they exist. So a bare 404 is ambiguous
// between "no access" and "no such file". Probe the repo itself to turn it
// into something the user can actually act on.
async function preflight() {
  let r;
  try {
    r = await gh('/repos/' + CFG.owner + '/' + CFG.repo);
  } catch (e) {
    throw new Error('Cannot reach GitHub. Check the connection.');
  }
  if (r.status === 401) {
    // 401 covers both an expired/revoked token and a truncated paste, so the
    // message has to name both rather than guess at one.
    const e = new Error('GitHub rejected the token — it has expired, been ' +
        'revoked, or was pasted incompletely (it is one long line starting ' +
        'with github_pat_).');
    e.auth = true;
    throw e;
  }
  if (r.status === 404) {
    throw new Error('That token cannot see ' + CFG.owner + '/' + CFG.repo +
        '. Edit the token: Repository access → Only select repositories ' +
        '→ ' + CFG.repo + ', and Permissions → Contents: ' +
        'Read and write.');
  }
  if (r.status === 403) {
    throw new Error('Token blocked (403) — it may be pending approval, ' +
        'or hit a rate limit.');
  }
  if (!r.ok) throw new Error('GitHub error ' + r.status);
  const j = await r.json();
  if (j.permissions && j.permissions.push === false) {
    throw new Error('Token is read-only, so progress could never be saved. ' +
        'Set Permissions → Contents: Read and write.');
  }
}
async function putFile(name, text, sha, message) {
  const body = { message: message || ('phone: update ' + name), content: enc(text) };
  if (sha) body.sha = sha;
  const r = await gh(fileUrl(name), { method: 'PUT', body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) return null;   // conflict
  if (!r.ok) throw new Error(name + ': HTTP ' + r.status);
  return (await r.json()).content.sha;
}

/* ------------------------------ state sync ------------------------------ */
async function pushState() {
  if (pushBusy) { pushDirty = true; return; }
  pushBusy = true;
  try {
    for (let attempt = 0; attempt < 6; attempt++) {
      const sha = await putFile('state.json',
          JSON.stringify(state, null, 1), stateSha, 'phone: graded cards');
      if (sha) { stateSha = sha; break; }
      const remote = await getFile('state.json');       // conflict -> merge
      state = SRS.mergeState(state, JSON.parse(remote.text || '{}'));
      stateSha = remote.sha;
    }
    localStorage.setItem('cachedState', JSON.stringify(state));
    status('synced ' + new Date().toLocaleTimeString());
  } catch (e) {
    status('sync pending — ' + e.message, true);
    setTimeout(pushState, 15000);                        // offline: retry
  } finally {
    pushBusy = false;
    if (pushDirty) { pushDirty = false; pushState(); }
  }
}

async function flushReviews() {
  if (!pendingReviews.length) return;
  try {
    for (let attempt = 0; attempt < 4; attempt++) {
      const f = await getFile('reviews-phone.jsonl');
      const text = (f.text || '') + pendingReviews.join('\n') + '\n';
      const sha = await putFile('reviews-phone.jsonl', text, f.sha,
                                'phone: session history');
      if (sha) {
        pendingReviews = [];
        localStorage.setItem('pendingReviews', '[]');
        return;
      }
    }
  } catch (e) { /* stays pending; next flush retries */ }
}

async function loadAll() {
  const cached = localStorage.getItem('cachedCards');
  if (cached) {
    cards = JSON.parse(cached);
    state = JSON.parse(localStorage.getItem('cachedState') || '{}');
  }
  try {
    await preflight();
    const [c, s, rv, rp] = await Promise.all([
      getFile('cards.json'), getFile('state.json'),
      getFile('reviews.jsonl'), getFile('reviews-phone.jsonl')]);
    if (c.text === null) {
      throw new Error('cards.json is missing from ' + CFG.repo + '.');
    }
    try {
      cards = JSON.parse(c.text);
    } catch (err) {
      throw new Error('cards.json in the repo is not valid JSON.');
    }
    // A corrupt remote state must never brick the app -- fall back to local.
    let remoteState = {};
    if (s.text) {
      try { remoteState = JSON.parse(s.text); } catch (err) { remoteState = {}; }
    }
    state = SRS.mergeState(JSON.parse(localStorage.getItem('cachedState') || '{}'),
                           remoteState);
    stateSha = s.sha;
    localStorage.setItem('cachedCards', c.text);
    localStorage.setItem('cachedState', JSON.stringify(state));
    reviewDays = {};
    const seen = new Set();
    for (const line of ((rv.text || '') + '\n' + (rp.text || '')).split('\n')) {
      if (!line.trim() || seen.has(line)) continue;
      seen.add(line);
      try {
        const r = JSON.parse(line);
        const d = r.ts.slice(0, 10);
        reviewDays[d] = reviewDays[d] || [0, 0];
        reviewDays[d][0]++; if (r.correct) reviewDays[d][1]++;
      } catch (e) {}
    }
    status('');
    return true;
  } catch (e) {
    if (!cards || !cards.length) throw e;
    authFailed = !!e.auth;
    status(e.auth
        ? 'token expired — drilling still works and nothing is lost, but '
          + 'syncing is off. Tap "Replace token".'
        : 'offline — using cached deck', true);
    return false;
  }
}

/* -------------------------------- home ---------------------------------- */
function localToday() { return SRS.iso(new Date()).slice(0, 10); }
function summary() {
  const now = new Date();
  const due = SRS.dueCards(cards, state, now).length;
  const days = Object.assign({}, reviewDays);
  for (const line of pendingReviews) {
    const r = JSON.parse(line); const d = r.ts.slice(0, 10);
    days[d] = days[d] || [0, 0]; days[d][0]++; if (r.correct) days[d][1]++;
  }
  const today = days[localToday()] || [0, 0];
  let streak = 0;
  const d = new Date();
  if (!days[localToday()]) d.setDate(d.getDate() - 1);
  while (days[SRS.iso(d).slice(0, 10)]) { streak++; d.setDate(d.getDate() - 1); }
  const seenCards = cards.filter(c => SRS.entryFor(state, c.id).reps > 0).length;
  return { due, today: today[0],
           acc: today[0] ? Math.round(100 * today[1] / today[0]) : null,
           streak, seenCards };
}
function renderHome() {
  renderLearnHome();
  const s = summary();
  $('h-due').textContent = s.due > 0 ? s.due + ' cards due' : 'All caught up';
  $('h-due').style.color = s.due > 0 ? '' : 'var(--green)';
  $('h-sub').textContent = s.seenCards + ' of ' + cards.length + ' cards started';
  const pct = cards.length ? Math.round(100 * s.seenCards / cards.length) : 0;
  $('h-bar').style.width = pct + '%';
  $('h-cap').textContent = pct + '% of the deck seen';
  $('t-due').textContent = s.due;
  $('t-due').style.color = s.due ? 'var(--amber)' : 'var(--green)';
  $('t-today').textContent = s.today;
  $('t-acc').textContent = s.acc === null ? '—' : s.acc + '%';
  $('t-streak').textContent = s.streak;
  $('b-sub').textContent = s.due > 0
      ? Math.min(s.due, SRS.SESSION_CAP) + ' cards waiting' : 'practice round';
  if (navigator.setAppBadge) {
    s.due ? navigator.setAppBadge(s.due) : navigator.clearAppBadge();
  }
  // iOS only allows push from the installed (Home Screen) app, so ask for it
  // there and explain the missing step when running in plain Safari.
  const installed = window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches;
  const b = $('b-notif');
  if (!installed) {
    // iOS exposes the Push API ONLY to Home Screen web apps -- window.PushManager
    // is undefined in a plain Safari tab. Feature-detecting first would hide the
    // button and leave no clue, so check install state first and say why.
    b.style.display = '';
    b.disabled = true;
    b.innerHTML = 'Notifications<small>Share → Add to Home Screen, ' +
        'then open it from there</small>';
  } else if ('Notification' in window && 'serviceWorker' in navigator &&
             'PushManager' in window && Notification.permission === 'default') {
    b.style.display = '';
    b.disabled = false;
    b.innerHTML = 'Enable notifications';
  } else {
    b.style.display = 'none';
  }

  // The token button is always available, but when syncing is actually broken
  // it should say so rather than looking like a settings item nobody needs.
  const tb = $('b-token');
  if (tb) {
    const n = pendingReviews.length;
    tb.innerHTML = authFailed
        ? 'Replace expired token<small>syncing is off'
          + (n ? ' · ' + n + ' card' + (n === 1 ? '' : 's') + ' waiting to upload' : '')
          + '</small>'
        : 'Replace token';
    tb.className = authFailed ? 'primary' : '';
  }
}
function goHome() {
  show('home');
  renderHome();
  flushReviews();
  flushLearn();
}

function toggleLearn() {
  LEARN.setEnabled(!LEARN.enabled());
  renderHome();
}

/* Recall practice reports its own numbers and says whose they are. It is
   never folded into the Classic counts: those are machine-graded choices and
   these are self-ratings, and one total covering both would be a fiction. */
function renderLearnHome() {
  const on = LEARN.enabled();
  $('h-learn').style.display = on ? '' : 'none';
  $('b-learn-off').innerHTML = on
      ? 'Use Classic only<small>hides recall practice</small>'
      : 'Turn recall practice back on';
  if (!on) return;
  const proj = LEARN.projectSkills(LEARN.events(), SRS);
  const practised = Object.keys(proj).length;
  const twoDay = Object.values(proj).filter(st =>
      /two different days/.test(LEARN.skillLabel(st.meaning))).length;
  const pending = LEARN.pending().length;
  const bits = [practised + '/' + LEARN.PILOT.length + ' tried'];
  if (twoDay) bits.push(twoDay + ' on 2 days');
  if (pending) bits.push(pending + ' to upload');
  bits.push('self-rated');
  $('b-recall-sub').textContent = bits.join(' · ');
}

/* -------------------------------- drill --------------------------------- */
function start(mode) {
  let q = SRS.selectQueue(cards, state, mode, new Date());
  if (!q.length && crankEnd && mode === 'due') {
    q = SRS.selectQueue(cards, state, 'all', new Date());
  }
  if (!q.length) { status('Nothing to study for that.'); return; }
  queue = q.map(([card]) =>
      Object.assign({}, card, { options: serveOptions(card) }));
  idx = 0; right = 0; wrong = 0;
  show('drill'); render();
}
function startCrank() { crankEnd = Date.now() + 30 * 60000; start('due'); }

/* A card's options are a POOL: the answer plus 3..N distractors. Each
   serving shows the answer plus a random sample of three distractors, so
   repeat viewings of a card vary -- drill.py's build_payload does the same
   on the Mac. Sampled here, once per serving, and the queue gets a shallow
   copy so the deck itself is never mutated. A legacy 4-option card yields
   exactly its four options; render() shuffles either way. */
function serveOptions(c) {
  const pool = c.options.filter(o => o !== c.answer);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 3).concat([c.answer]);
}

const KICKER = { zh2en: 'CHOOSE THE MEANING',
                 en2zh: 'CHOOSE THE CHINESE',
                 zh2py: 'CHOOSE THE PRONUNCIATION' };

function render() {
  const c = queue[idx];
  locked = false;
  awaitingNext = false;
  $('d-next').style.display = 'none';
  $('foot').classList.remove('reveal');
  $('d-kicker').textContent = KICKER[c.dir] || 'CHOOSE THE MEANING';
  $('prompt').textContent = c.prompt;
  const opts = c.options.slice();
  for (let i = opts.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }
  const box = $('opts');
  box.innerHTML = '';
  opts.forEach((o, i) => {
    const d = document.createElement('div');
    d.className = 'opt';
    d.innerHTML = '<b>' + 'ABCD'[i] + '</b><span></span>';
    d.querySelector('span').textContent = o;
    d.onclick = () => pick(d, o, c);
    box.appendChild(d);
  });
  let foot = (idx + 1) + ' of ' + queue.length;
  if (crankEnd) {
    foot += '   ·   ' +
        Math.max(0, Math.ceil((crankEnd - Date.now()) / 60000)) + ' min left';
  }
  $('foot').textContent = foot;
}

/* Every graded card reveals hanzi — pinyin — meaning, right or wrong: a
   lucky guess should teach as much as a miss. Hanzi and meaning resolve per
   direction; for zh2py (whose card carries no English) the meaning comes
   from the item's zh2en sibling -- same id prefix with a ":zh2en" suffix --
   and falls back to nothing if that card is not in the deck. */
function revealFor(c) {
  let hanzi, meaning;
  if (c.dir === 'en2zh') { hanzi = c.answer; meaning = c.prompt; }
  else                   { hanzi = c.prompt; meaning = c.answer; }
  if (c.dir === 'zh2py') {
    meaning = '';
    const sib = cards.find(x =>
        x.id === c.id.slice(0, c.id.lastIndexOf(':')) + ':zh2en');
    if (sib) meaning = sib.answer;
  }
  return [hanzi, c.pinyin, meaning].filter(s => s);
}

function pick(el, opt, c) {
  if (locked) return;
  locked = true;
  const ok = opt === c.answer;
  document.querySelectorAll('.opt').forEach(d => {
    const t = d.querySelector('span').textContent;
    if (t === c.answer) d.classList.add('right');
    else if (d === el) d.classList.add('wrong');
  });
  const reveal = revealFor(c);
  // parts + example show on every reveal, right or wrong: they are the
  // lesson. `hint` stays miss-only -- it is a nudge, not content.
  const head = ok ? ['Correct'].concat(reveal).join('  —  ')
                  : reveal.concat(c.hint ? [c.hint] : []).join('  —  ');
  const study = [c.parts, c.example].filter(Boolean);
  $('foot').textContent = head;
  if (study.length) {
    for (const line of study) {
      const d = document.createElement('div');
      d.className = 'study';
      d.textContent = line;
      $('foot').appendChild(d);
    }
  }
  $('foot').classList.add('reveal');
  if (ok) right++; else wrong++;
  if (navigator.vibrate) navigator.vibrate(ok ? 10 : [30, 40, 30]);

  commitLocal(c, ok);
  // Every graded card holds its reveal until the operator taps Next -- right
  // answers included. Guessing correctly is easy; the pause is where the
  // hanzi — pinyin — meaning triple actually gets studied.
  awaitingNext = true;
  $('d-next').style.display = '';
}

function advance() {
  if (!awaitingNext) return;
  awaitingNext = false;
  $('d-next').style.display = 'none';
  next();
}

/* --------------------------- recall practice ---------------------------- */
/* The opt-in mode: see the character alone, try to remember it, reveal, then
   rate yourself on pronunciation and meaning separately.

   Nothing here touches Classic. It does not read or write `state`, does not
   append to pendingReviews, and does not call pushState -- its records go to
   learn.* locally and learning-v2/ remotely. test-learn.js holds that line
   with a spying store. The reveal is also built only at reveal time, so the
   answer is not sitting in the DOM while you are still trying to recall it. */
let rQueue = [], rIdx = 0, rSession = null, rRatings = null, rRevealed = false;

// Pilot items are stored as base ids; the content comes from the deck we
// already loaded, so no deck text is duplicated into this repo.
function recallCard(baseId) {
  const c = cards.find(x => x.id === baseId + ':zh2en');
  if (!c) return null;
  return { itemId: baseId, hanzi: c.prompt, meaning: c.answer,
           pinyin: c.pinyin || '', parts: c.parts || '', example: c.example || '' };
}

function startRecall() {
  if (!cards.length) { status('Deck not loaded yet.'); return; }
  const proj = LEARN.projectSkills(LEARN.events(), SRS);
  rQueue = LEARN.dueItems(proj, new Date()).map(recallCard).filter(Boolean);
  if (!rQueue.length) { status('No recall items available.'); return; }
  rSession = LEARN.uuid();
  rIdx = 0;
  show('recall');
  renderRecall();
}

function renderRecall() {
  const c = rQueue[rIdx];
  rRevealed = false;
  rRatings = { pronunciation: null, meaning: null, revealedAt: null };
  $('r-kicker').textContent =
      'SAY IT AND MEAN IT  ·  ' + (rIdx + 1) + ' / ' + rQueue.length;
  $('r-face').textContent = c.hanzi;
  $('r-study').innerHTML = '';          // nothing revealed is in the DOM yet
  $('r-rate').innerHTML = '';
  $('r-reveal').style.display = '';
  $('r-blank').style.display = '';
  $('r-next').style.display = 'none';
  $('r-status').textContent = '';
}

/* Two entry points, not one boolean. The markup used to pass an array here
   and an empty array is truthy, so every ordinary Reveal was being recorded
   as a total miss. Named functions cannot be got wrong from the call site. */
function revealRecall() { doReveal(false); }
function revealBlank() { doReveal(true); }

function doReveal(blank) {
  if (rRevealed) return;
  rRevealed = true;
  rRatings.revealedAt = new Date().toISOString();
  const c = rQueue[rIdx];
  const box = $('r-study');
  box.innerHTML = '';
  const add = (cls, text) => {
    if (!text) return;
    const d = document.createElement('div');
    d.className = cls;
    d.textContent = text;
    box.appendChild(d);
  };
  add('py', c.pinyin);
  add('mn', c.meaning);
  add('st', c.parts);
  add('st', c.example);
  $('r-reveal').style.display = 'none';
  $('r-blank').style.display = 'none';
  if (navigator.vibrate) navigator.vibrate(8);

  // "No idea" is a miss, not assistance: it earns no credit, but it must not
  // be reported later as though a hint had been given.
  if (blank === true) {
    rRatings.pronunciation = 'no';
    rRatings.meaning = 'no';
    buildRate(true);
    commitRecall();
  } else {
    buildRate(false);
  }
}

function buildRate(locked) {
  const groups = [
    ['pronunciation', 'DID YOU SAY IT RIGHT?', [['yes', 'Yes'], ['no', 'No']]],
    ['meaning', 'DID YOU KNOW THE MEANING?',
     [['yes', 'Yes'], ['partly', 'Partly'], ['no', 'No']]],
  ];
  const wrap = $('r-rate');
  wrap.innerHTML = '';
  for (const [skill, label, opts] of groups) {
    const g = document.createElement('div');
    g.className = 'rate' + (locked ? ' done' : '');
    const q = document.createElement('div');
    q.className = 'q';
    q.textContent = label;
    const row = document.createElement('div');
    row.className = 'row';
    for (const [value, text] of opts) {
      const b = document.createElement('button');
      b.textContent = text;
      if (rRatings[skill] === value) b.className = 'sel';
      if (!locked) b.onclick = () => setRate(skill, value);
      row.appendChild(b);
    }
    g.appendChild(q);
    g.appendChild(row);
    wrap.appendChild(g);
  }
}

function setRate(skill, value) {
  rRatings[skill] = value;
  buildRate(false);
  if (rRatings.pronunciation && rRatings.meaning) commitRecall();
}

// Writes the answer, then shows Next. The record is durable before the
// screen is allowed to move on -- localStorage is synchronous, which is the
// whole reason the log lives there rather than in IndexedDB.
function commitRecall() {
  const c = rQueue[rIdx];
  const ev = LEARN.newEvent({
    deviceId: LEARN.deviceId(), sessionId: rSession, itemId: c.itemId,
    occurredAt: new Date().toISOString(), revealedAt: rRatings.revealedAt,
    pronunciation: rRatings.pronunciation, meaning: rRatings.meaning,
  });
  LEARN.append(ev);
  buildRate(true);
  $('r-next').style.display = '';
  $('r-next').textContent = (rIdx + 1 < rQueue.length) ? 'Next' : 'Finish';
  const n = LEARN.pending().length;
  $('r-status').textContent = 'saved on this phone' +
      (n ? '  ·  ' + n + ' waiting to upload' : '');
}

function nextRecall() {
  rIdx++;
  if (rIdx < rQueue.length) { renderRecall(); return; }
  flushLearn();
  goHome();
}

/* Upload as an immutable batch. The path is derived from the event ids, so a
   retry of the same set lands on the same path; a create without a sha fails
   if that path already exists, which is how "never overwrite" is enforced.
   On that failure the remote copy is read back: identical means an earlier
   attempt succeeded and the response was simply lost, so the events are
   acknowledged. Different means a genuine collision, and both copies are
   left untouched for inspection. */
async function flushLearn() {
  const pending = LEARN.pending();
  if (!pending.length || !TOKEN) return;
  const path = LEARN.batchPath(LEARN.deviceId(), pending[0].occurredAt,
                               LEARN.batchId(pending));
  // Deterministic for a given set of events: no upload timestamp, no clock.
  // A retry has to produce byte-identical content, otherwise the readback
  // below can never recognise this device's own earlier upload and the
  // events stay pending for ever. (They did, until this line lost its
  // uploadedAt field.) Each event already carries its own occurredAt.
  const payload = JSON.stringify(
      { schemaVersion: LEARN.SCHEMA, deviceId: LEARN.deviceId(),
        events: pending }, null, 1);
  const ids = pending.map(e => e.eventId);
  try {
    const sha = await putFile(path, payload, null, 'phone: recall practice');
    if (sha) { LEARN.markSynced(ids); return; }
    const remote = await getFile(path);
    if (remote && remote.text === payload) { LEARN.markSynced(ids); return; }
    status('recall upload conflict — both copies kept, nothing overwritten', true);
  } catch (e) {
    // Stays pending. Never cleared on error, and never reported as synced.
    status('recall practice saved on this phone — upload pending', true);
  }
}

/* Export is a read: it takes the Classic values as arguments rather than
   touching them, so the act of exporting can never modify what it reports. */
function exportProgress() {
  const bundle = LEARN.exportBundle({
    coverage: TOKEN ? 'this device; remote history not included'
                    : 'this device only (no token, so nothing was fetched)',
    legacyState: state,
    legacyPendingReviews: pendingReviews,
  });
  const name = 'mandarin-progress-' +
      new Date().toISOString().slice(0, 10) + '-' + LEARN.deviceId() + '.json';
  const blob = new Blob([JSON.stringify(bundle, null, 1)],
                        { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  status('exported ' + name);
}

// The single local write path: grade, cache, queue the history line, sync.
function commitLocal(c, ok) {
  const now = new Date();
  state[c.id] = SRS.grade(SRS.entryFor(state, c.id), ok, now);
  localStorage.setItem('cachedState', JSON.stringify(state));
  pendingReviews.push(JSON.stringify({
    ts: SRS.iso(now), id: c.id, correct: ok, cat: c.cat, dir: c.dir }));
  localStorage.setItem('pendingReviews', JSON.stringify(pendingReviews));
  pushState();
}

function next() {
  idx++;
  if (idx < queue.length) { render(); return; }
  flushReviews();
  if (crankEnd && Date.now() < crankEnd - 20000) { start('due'); return; }
  sessionDone();
}

function sessionDone() {
  crankEnd = 0;
  $('done-line').textContent =
      'Done — ' + right + '/' + (right + wrong) + ' right';
  const due = SRS.dueCards(cards, state, new Date()).length;
  $('done-sub').textContent = due > 0 ? due + ' more still due' : 'all caught up';
  show('done');
}

/* ------------------------------- push ----------------------------------- */
function b64uToBytes(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}
async function enablePush() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { status('notifications declined', true); return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64uToBytes(CFG.vapidPublicKey),
    });
    const cur = await getFile('push-subscription.json');
    await putFile('push-subscription.json', JSON.stringify(sub.toJSON(), null, 1),
                  cur.sha, 'phone: push subscription');
    $('b-notif').style.display = 'none';
    status('notifications on');
  } catch (e) { status('push setup failed: ' + e.message, true); }
}

/* -------------------------------- boot ----------------------------------- */
let authFailed = false;

// Re-show the connect screen so a lapsed token can be replaced in place.
// Deliberately does not clear localStorage: pendingReviews lives there, and
// wiping it would throw away drilling that has not been uploaded yet.
function replaceToken() {
  $('tok').value = '';
  const n = pendingReviews.length;
  $('s-err').textContent = n
      ? n + ' graded card' + (n === 1 ? '' : 's') + ' waiting to upload. '
        + 'They are safe on this phone — paste a new token to send them.'
      : '';
  show('setup');
}

async function saveToken() {
  TOKEN = $('tok').value.trim();
  if (!TOKEN) return;
  localStorage.setItem('ghtok', TOKEN);
  try { await boot(); }
  catch (e) { $('s-err').textContent = 'Could not load: ' + e.message; }
}
async function boot() {
  CFG = await (await fetch('./config.json')).json();
  $('s-repo').textContent = CFG.owner + '/' + CFG.repo;
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
  if (!TOKEN) { show('setup'); return; }
  try {
    await loadAll();
    goHome();
  } catch (e) {
    show('setup');
    $('s-err').textContent = 'Could not load: ' + e.message;
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { flushReviews(); }
  else if ($('home').classList.contains('on') && TOKEN) {
    loadAll().then(renderHome).catch(() => {});
  }
});
boot();
</script>
